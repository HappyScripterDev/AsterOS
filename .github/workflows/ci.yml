name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup show
          rustup target add x86_64-unknown-none x86_64-unknown-uefi

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 xz-utils

      - name: Firmware
        run: python3 tools/fetch_firmware.py

      - name: Host tests
        run: python3 -m unittest discover -s tests -v

      - name: Build
        run: python3 tools/build.py

      - name: Boot smoke test
        run: python3 tools/test.py --skip-build

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-diagnostics
          path: |
            build/test/serial.log
            build/serial.log
            build/test/smoke.ppm
          if-no-files-found: ignore
