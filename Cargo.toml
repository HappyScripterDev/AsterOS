[workspace]
resolver = "2"
members = [
    "boot",
    "kernel",
    "shared/aster-abi",
    "shared/aster-motion",
    "user/asterdesk",
    "user/isoprobe",
    "user/faultprobe",
    "user/ipcprobe",
    "user/configd",
    "user/netprobe",
]

[profile.release]
panic = "abort"
opt-level = 2
lto = false
codegen-units = 1
debug = 1
strip = false
